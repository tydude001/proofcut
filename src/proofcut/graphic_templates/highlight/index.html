<!doctype html>
<!-- proofcut graphic template `highlight`. Phases: intro 0-1.2s (the line
     rises in 0.5s, the marker sweeps 0.5-1.1s), a still hold, outro 0.4s. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Outfit"; font-weight: 700; src: url("/_proofcut/fonts/static/Outfit-Bold.ttf"); }
:root { --u: calc(min(100vw, 100vh) / 1080); }
html, body { margin: 0; width: 100vw; height: 100vh; background: transparent; overflow: hidden; }
.out { position: absolute; inset: 0; animation: out .4s ease-in 1.2s forwards; }
@keyframes out { to { opacity: 0; } }
.line { position: absolute; left: 5vw; right: 5vw; top: {{y}}%; translate: 0 -50%; text-align: center;
  font: 700 calc({{size}} * var(--u)) / 1.2 "Outfit"; color: {{text_colour}};
  text-shadow: 0 calc(4 * var(--u)) calc(18 * var(--u)) rgba(0,0,0,.35);
  animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { transform: translateY(calc(50 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
.word { position: relative; isolation: isolate; white-space: nowrap; }
.word::before { content: ""; position: absolute; z-index: -1; left: -.08em; right: -.08em; bottom: .08em; height: .42em;
  background: {{marker_colour}}; transform-origin: left; transform: scaleX(0);
  animation: sweep .6s cubic-bezier(0,0,.58,1) .5s forwards; }
@keyframes sweep { to { transform: scaleX(1); } }
</style></head><body>
<div class="out"><div class="line">{{before}} <span class="word">{{word}}</span> {{after}}</div></div>
</body></html>
