<svg xmlns="http://www.w3.org/2000/svg" width="{{width}}" height="{{height}}" viewBox="0 0 1920 {{view_height}}">
  <defs>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.52" stop-color="{{ink}}" stop-opacity="0"/>
      <stop offset="0.5475" stop-color="{{ink}}" stop-opacity="{{ramp_1}}"/>
      <stop offset="0.5750" stop-color="{{ink}}" stop-opacity="{{ramp_2}}"/>
      <stop offset="0.6025" stop-color="{{ink}}" stop-opacity="{{ramp_3}}"/>
      <stop offset="0.6300" stop-color="{{ink}}" stop-opacity="{{ramp_4}}"/>
      <stop offset="0.6575" stop-color="{{ink}}" stop-opacity="{{ramp_5}}"/>
      <stop offset="0.6850" stop-color="{{ink}}" stop-opacity="{{ramp_6}}"/>
      <stop offset="0.7125" stop-color="{{ink}}" stop-opacity="{{ramp_7}}"/>
      <stop offset="0.74" stop-color="{{ink}}" stop-opacity="{{mid_opacity}}"/>
      <stop offset="1" stop-color="{{ink}}" stop-opacity="{{edge_opacity}}"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1920" height="{{view_height}}" fill="url(#scrim)"/>
</svg>
