# The Windows test kit, run on GitHub's Windows runner — docs/plans/PORTABILITY.md
# § Step 5, mac-demo.yml's twin.
#
# ci.yml's Windows job has ffmpeg and nothing else, so every render and
# transcription test skips there. This job runs scripts/windows_trial.ps1 the
# way a tester does — a portable uv into one folder, then scripts/setup_trial.py:
# `proofcut setup`, doctor, docs/DEMO.md to a render — under Windows PowerShell
# 5.1, which is what a stock Windows runs it with. Then scripts/trial_check.py
# judges what the run printed and rendered. The kit exits 0 on a render that
# disagrees with the timeline, because it was written for a person who reads
# the report, so its exit code is never the verdict here.
#
# Since 2026-09-21 the kit installs with `proofcut setup` and carries no install
# code of its own (HISTORY.md § The kits call setup), so this job and
# setup-demo.yml run the same install and demo; this one adds the kit around
# them, under 5.1, and the probe below.
#
# It is not a person on a PC: the runner is Windows Server, nothing prompts,
# and nobody reads the instructions. Those stay the Windows test issue form's
# question, and a green run here does not replace README.md's "never been run
# on Windows" sentence on its own.
#
# Windows minutes bill at 2x while the repo is private, so this runs only when
# something the demo exercises changes, and by hand.

name: windows-demo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/windows_trial.ps1"
      - "scripts/setup_trial.py"
      - "scripts/windows_probe.ps1"
      - "scripts/windows_probe.py"
      - "scripts/trial_check.py"
      - "scripts/make_demo.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # `powershell`, not the step's own pwsh: the kit is written for 5.1, and
      # a pass under 7 would say nothing about the shell a person has.
      # -Unattended answers the kit's two prompts: it starts, and declines to
      # open the editor at the end.
      - name: the Windows test kit
        shell: pwsh
        env:
          PROOFCUT_TRIAL_REPORT: ${{ runner.temp }}\proofcut-windows-report.zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows_trial.ps1 -Unattended
      # The runner's own Python, since the check is stdlib-only and the kit may
      # have stopped before uv arrived; setup's ffmpeg in ~\.local\bin, since
      # the check reads the frames with it and the runner has none on PATH.
      # report.txt and kit.txt are copied beside the zip first: the kit's folder
      # is on C: and runner.temp on D:, and upload-artifact refuses paths with
      # no common parent (the first windows-demo run uploaded nothing).
      - name: judge the run
        if: always()
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $trial = Join-Path $env:LOCALAPPDATA 'proofcut-windows-trial'
          foreach ($f in 'report.txt', 'kit.txt') {
            Copy-Item -LiteralPath (Join-Path $trial $f) -Destination $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          }
          $env:PATH = "$(Join-Path $env:USERPROFILE '.local\bin');$env:PATH"
          python scripts\trial_check.py $trial
          exit $LASTEXITCODE
      # scripts/windows_probe.ps1 against the kit's folder: PORTABILITY.md 5e's
      # path, drive, case and caption classes. The runner has a D: (runner.temp
      # is on it), so the second-drive case runs here too. continue-on-error
      # until a first run's findings have been judged — a new probe's first
      # output is candidates, not verdicts. The report is what gets read.
      - name: the Windows probe
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          PROOFCUT_PROBE_REPORT: ${{ runner.temp }}\proofcut-windows-probe.zip
        run: |
          $drive = (Split-Path -Qualifier $env:RUNNER_TEMP) + '\'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows_probe.ps1 -SecondDrive $drive
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofcut-windows-report
          path: |
            ${{ runner.temp }}\proofcut-windows-report.zip
            ${{ runner.temp }}\report.txt
            ${{ runner.temp }}\kit.txt
            ${{ runner.temp }}\proofcut-windows-probe.zip
          if-no-files-found: warn
