# Lint, and the suite on a runner with ffmpeg and nothing else proofcut shells
# out to. Tests that need whisper, auto-editor, melt or ImageMagick skip
# there rather than fail — measured 2026-09-10 by running the suite with all
# four off PATH (HISTORY.md § The repo, readied for strangers) — so a green
# run here covers everything but the renders and transcription, which only
# a machine with those tools can check.
#
# The suite runs on macOS and Windows too (docs/plans/PORTABILITY.md step 3),
# with ffmpeg and nothing else, so the same ground is covered on all three.
# Neither is support: a platform whose render has not been read back on a real
# machine is unsupported whatever passes here (step 6). `fail-fast: false`
# because a Windows failure is a finding about paths, not a reason to stop the
# Linux run that has always been green.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      # `ruff check` only, at the dev group's pinned version — ruff's default
      # rule set moves between releases. Never `ruff format`: there is no ruff
      # config, and the formatter's 88-column default rewrites almost every file.
      - run: uv run ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: ffmpeg (with libass) and fontconfig
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
      # No fontconfig on either: libass uses the OS's own font system there,
      # and installing fontconfig would measure the wrong resolver (the plan's
      # "what this deliberately does not do").
      - name: ffmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --locked
      # The caption face, installed the way doctor tells a user to. The probe
      # tests assert it draws, and they run wherever ImageMagick is — the
      # Windows image ships one — so without this they measured a runner
      # nobody had set up (the first Windows run, 2026-09-10). On Windows it
      # is also the registration `fonts._register_windows` writes, exercised.
      - run: uv run proofcut fonts --install
      # The headless browser animated graphics are captured through, from
      # setup's own pin, so `tests/test_graphic.py`'s determinism test runs on
      # all three OSes rather than on the one it was measured on
      # (DAYDREAM.md § Animated graphics, designed and spiked, the last
      # recommendation). setup's installer rather than a second download path.
      - name: headless browser (setup's pin)
        shell: bash
        run: >-
          uv run python -c "import sys; from proofcut import install;
          r = install.install({'pieces': [{'name': 'chrome', 'version': 'pinned'}]});
          sys.exit(0 if r['installed'] == ['chrome'] else 1)"
      # What each runner actually resolves, printed before the suite rather
      # than inferred from which tests skipped: the first Windows run ran the
      # `@needs_melt` tests on a runner nobody had put melt on, and nothing in
      # the log said what had answered. Informational — a runner with only
      # ffmpeg is missing required tools by design.
      - run: uv run proofcut doctor
        continue-on-error: true
      # `-n auto` since 2026-09-24. SUITE-SPEED.md kept CI serial "until it is
      # measured on the runners"; the measurement was the serial runs
      # themselves: 13:42 (Linux), 11:34 (macOS), 22:29 (Windows) of pytest
      # per job, over 90% of each job's wall time. The one parallel hazard
      # the plan found, the flatpak melt launch race, cannot occur here: no
      # runner has melt. Parallel it is about 5:40 / 5:50 / 8:50 (HISTORY.md
      # § The suite in two minutes, and the flatpak launch race).
      - run: uv run pytest -n auto -q -rfE
