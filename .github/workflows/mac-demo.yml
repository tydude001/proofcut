# The Mac test kit, run on GitHub's macOS runner — docs/plans/LAUNCH.md § Step 2.
#
# ci.yml's macOS job has ffmpeg and nothing else, so every render and
# transcription test skips there. This job runs scripts/mac_trial.sh the way a
# tester does — Homebrew formulae, the Shotcut app's melt, whisper from uv,
# then docs/DEMO.md to a render — and scripts/trial_check.py judges what
# the run printed and rendered. The kit exits 0 on a render that disagrees
# with the timeline, because it was written for a person who reads the report,
# so its exit code is never the verdict here.
#
# It is not a person on a Mac: the runner already carries Homebrew and much
# else, nothing prompts, and nobody reads the instructions. Those stay the Mac
# test issue form's question, and a green run here does not replace README.md's
# "never been run on macOS" sentence on its own.
#
# macOS minutes bill at 10x while the repo is private, so this runs only when
# something the demo exercises changes, and by hand.
#
# The Intel runner takes the kit's other route — pinned downloads into one
# folder, no Homebrew — because Homebrew refuses Intel Macs now (issue #4).
# It is the only Intel Mac this repo can reach before a person's.

name: mac-demo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/mac_trial.sh"
      - "scripts/trial_check.py"
      - "scripts/make_demo.py"
      - "scripts/espeak_ng_lib.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mac-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # stdin from /dev/null answers the kit's two prompts: the start prompt
      # reads nothing and carries on, and the closing "open the editor?" reads
      # nothing and declines.
      - name: the Mac test kit
        env:
          PROOFCUT_TRIAL_REPORT: ${{ runner.temp }}/proofcut-mac-report.zip
        run: bash scripts/mac_trial.sh < /dev/null
      # On Intel, uv lives in the kit's folder, and its Python there is the one to reuse.
      - name: judge the run
        if: always()
        run: |
          if [ -x ~/proofcut-mac-trial/tools/bin/uv ]; then
            export PATH=~/proofcut-mac-trial/tools/bin:$PATH
            export UV_PYTHON_INSTALL_DIR=~/proofcut-mac-trial/uv/python UV_CACHE_DIR=~/proofcut-mac-trial/uv/cache
          fi
          uv run python scripts/trial_check.py ~/proofcut-mac-trial
      # The runner has Rust, OpenSSL and pkg-config and a tester's Mac has none of them,
      # so a package with no wheel for this Mac compiles here and fails there (issue #5,
      # cryptography). OpenTimelineIO has no Intel wheel and builds with Apple's compiler alone.
      - name: uv sync compiled nothing unexpected
        if: always()
        run: |
          built=$(sed -n '/^── uv sync$/,/^── /p' ~/proofcut-mac-trial/report.txt |
            sed -n 's/^ *Building \([^ =@]*\).*/\1/p' | grep -v -x -e proofcut -e opentimelineio || true)
          if [ -n "$built" ]; then
            echo "uv sync compiled a package a tester's Mac may not be able to: $built"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofcut-mac-report-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/proofcut-mac-report.zip
            ~/proofcut-mac-trial/report.txt
          if-no-files-found: warn
