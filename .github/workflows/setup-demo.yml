# `proofcut setup` on Windows and both Macs, judged by a checked render —
# docs/plans/INSTALL.md § Step 5.
#
# This job starts from a runner with uv and none of proofcut's tools, runs
# scripts/setup_trial.py — `proofcut setup --yes`, `proofcut doctor`, which must
# pass, and docs/DEMO.md — and judges the render with scripts/trial_check.py.
# Then it uninstalls and requires setup's folder, ~/.local/bin and uv's tools
# and Pythons to be as setup found them. windows-demo.yml and mac-demo.yml run
# the test kits, which since 2026-09-21 fetch a pinned uv and then run this
# same script (HISTORY.md § The kits call setup), so there is one install path;
# this job is the one that also checks the uninstall.
#
# What a runner already has, setup leaves alone — that is its rule — so read
# the `proofcut setup --plan` step in report.txt for which pieces this run
# actually installed.
#
# Apple silicon (macos-latest) joined on 2026-09-20, when the tester post it
# was waiting on was given up as unanswered. It is the only route with no
# person's run behind it, so this job is its whole evidence — and it is not
# the Homebrew route INSTALL.md § Step 5 assumed, but the Intel route with
# each download's arm64 build: Shotcut's dmg is universal, and osxexperts.net
# releases an arm64 ffmpeg with libass. HISTORY.md § `proofcut setup` on
# Apple silicon.

name: setup-demo

on:
  push:
    branches: [main]
    paths:
      - "src/proofcut/install.py"
      - "src/proofcut/deps.py"
      - "src/proofcut/doctor.py"
      - "src/proofcut/picture.py"
      - "src/proofcut/autoeditor.py"
      - "scripts/setup_trial.py"
      - "scripts/trial_check.py"
      - "scripts/make_demo.py"
      - "scripts/espeak_ng_lib.py"
      - ".github/workflows/setup-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked
      # `runner` is not a context job-level `env` can read, so the folder is
      # set here for every later step (the first run failed on exactly that).
      - name: the trial's folder
        run: echo "WORK=$RUNNER_TEMP/setup-trial" >> "$GITHUB_ENV"
      - name: setup, doctor, and the demo
        run: uv run python scripts/setup_trial.py "$WORK"
      # setup's ffmpeg is in ~/.local/bin, which the trial put first on its
      # own children's PATH; the check reads the frames with it too.
      - name: judge the render
        if: always()
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run python scripts/trial_check.py "$WORK"
      - name: uninstall, and compare
        if: always()
        run: uv run python scripts/setup_trial.py "$WORK" --uninstall
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: setup-trial-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/setup-trial/report.txt
            ${{ runner.temp }}/setup-trial/uninstall.txt
            ${{ runner.temp }}/setup-trial/frame-*.png
          if-no-files-found: warn
