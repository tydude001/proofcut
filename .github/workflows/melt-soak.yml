# Renders the demo project through melt many times on both Mac runners, to
# measure the "moov atom not found" flake rather than re-run past it.
#
# Shotcut's Mac melt has left a file with no moov atom four times in mac-demo
# (2026-09-14, 09-17, 09-24, 09-25 on Apple Silicon; 09-22 on Intel), and
# each passed on a plain re-run.
# The log held only ffprobe's complaint until picture.render began carrying
# melt's own exit and stderr, so this is the first run that can say how melt
# stopped: a signal, a clean exit, or something in its output. Any crash
# report macOS wrote for melt is uploaded with the log.
#
# Its first run (2026-09-25) found a SIGSEGV in MLT's `cache_object_close`,
# 3 of 60 renders, and picture.render now runs a crashed render again
# (HISTORY.md § The Mac melt crash). The cause was another thread's
# `setlocale`, which a render no longer triggers (§ The Mac melt crash,
# found); run 36519467972 on the fix uploaded no crash report.
#
# Given `mlt_branch`, it tests an MLT fix for that crash instead: it builds
# libmlt from the branch and from the master commit the branch forks from,
# swaps each into its own copy of Shotcut.app, and renders the demo's
# document through both, interleaved (scripts/melt_soak.py). That document
# keeps its `LC_NUMERIC`, so it reaches the `setlocale` path, and melt runs
# directly, so `picture.render` re-runs no crash out of the count. The arms
# differ only by the branch's commits: Shotcut's own libmlt is a master
# snapshot of its own, so it is no control for a branch cut later.
#
# By hand only: it is a measurement, not a gate.

name: melt-soak

on:
  workflow_dispatch:
    inputs:
      renders:
        description: "renders per runner"
        default: "30"
      runners:
        description: "a JSON list of Mac runners"
        default: '["macos-latest", "macos-15-intel"]'
      mlt_branch:
        description: "an MLT branch to test against its master base (empty: soak proofcut's own render path)"
        default: ""

permissions:
  contents: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      # The kit is only here to install and build the demo project; its own
      # verdict is mac-demo's business, so its exit is not this job's.
      - name: the Mac test kit, for the demo project
        run: bash scripts/mac_trial.sh < /dev/null || true
      - name: render the demo again and again
        if: inputs.mlt_branch == ''
        env:
          RENDERS: ${{ inputs.renders }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          proj=~/proofcut-mac-trial/demo/proj
          out=~/melt-soak
          mkdir -p "$out"
          test -f "$proj/proofcut.json" || { echo "the kit built no demo project"; exit 1; }
          failed=0
          for i in $(seq 1 "$RENDERS"); do
            start=$(date +%s)
            if .venv/bin/python3 -m proofcut.cli -C "$proj" export "$out/render.mp4" --render \
                > "$out/$i.log" 2>&1; then
              status=ok
              rm -f "$out/$i.log"
            else
              status=FAIL
              failed=$((failed + 1))
            fi
            echo "$i $status $(( $(date +%s) - start ))s" | tee -a "$out/summary.txt"
          done
          echo "$failed of $RENDERS renders failed" | tee -a "$out/summary.txt"
          {
            echo "### ${{ matrix.os }}: $failed of $RENDERS renders failed"
            for f in "$out"/*.log; do
              [ -e "$f" ] || continue
              echo; echo "#### render $(basename "$f" .log)"; echo '```'; tail -40 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      # The framework alone: the fix is in src/framework, and every module
      # Shotcut ships links libmlt by name, so a swapped dylib is the whole
      # change. Every MOD_/USE_ option is turned off, read from the checkout so
      # a new module cannot pull a dependency the runner lacks into the build.
      - name: build libmlt from the branch and from its base
        if: inputs.mlt_branch != ''
        env:
          BRANCH: ${{ inputs.mlt_branch }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/mltframework/mlt ~/mlt
          cd ~/mlt
          git fetch origin "$BRANCH" master
          fix=$(git rev-parse "origin/$BRANCH")
          base=$(git merge-base "origin/$BRANCH" origin/master)
          echo "fix $fix, master $base" | tee ~/mlt-revisions.txt
          for arm in "fix:$fix" "master:$base"; do
            name=${arm%%:*}
            git worktree add --detach ~/mlt-"$name" "${arm#*:}"
            off=$(grep -oE '^option\((MOD|USE)_[A-Z0-9_]+' ~/mlt-"$name"/CMakeLists.txt | sed -E 's/^option\(/-D/; s/$/=OFF/')
            # shellcheck disable=SC2086
            cmake -S ~/mlt-"$name" -B ~/mlt-"$name"/build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DBUILD_TESTING=OFF -DBUILD_DOCS=OFF -DCLANG_FORMAT=OFF $off
            cmake --build ~/mlt-"$name"/build --target mlt -j "$(sysctl -n hw.ncpu)"
          done
      # Re-signed ad hoc, melt and the dylib both, in both arms alike: melt
      # ships under the hardened runtime, whose library validation refuses a
      # dylib another team signed.
      - name: two copies of Shotcut.app, one libmlt each
        if: inputs.mlt_branch != ''
        run: |
          set -euo pipefail
          app="$HOME/.local/share/proofcut/deps/melt/Shotcut.app"
          test -x "$app/Contents/MacOS/melt" || { echo "the kit installed no Shotcut melt at $app"; exit 1; }
          otool -L "$app/Contents/MacOS/melt" | grep -i mlt
          for name in fix master; do
            mkdir -p ~/arms/"$name"
            ditto "$app" ~/arms/"$name"/Shotcut.app
            built=$(find ~/mlt-"$name"/build -name 'libmlt-7*.dylib' -type f | head -1)
            test -n "$built" || { echo "no libmlt built for $name"; exit 1; }
            found=0
            while IFS= read -r stock; do
              id=$(otool -D "$stock" | tail -1)
              cp -f "$built" "$stock"
              install_name_tool -id "$id" "$stock"
              codesign --force --sign - "$stock"
              echo "$name: $built -> $stock (id $id)"
              found=1
            done < <(find ~/arms/"$name"/Shotcut.app/Contents -name 'libmlt-7*.dylib' -type f)
            test "$found" = 1 || { echo "no libmlt in Shotcut.app"; exit 1; }
            codesign --force --sign - ~/arms/"$name"/Shotcut.app/Contents/MacOS/melt
            ~/arms/"$name"/Shotcut.app/Contents/MacOS/melt --version < /dev/null || true
          done
      - name: render the branch against its base, interleaved
        if: inputs.mlt_branch != ''
        env:
          RENDERS: ${{ inputs.renders }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          .venv/bin/python3 scripts/melt_soak.py ~/proofcut-mac-trial/demo/proj ~/melt-soak \
            --renders "$RENDERS" \
            --melt fix="$HOME/arms/fix/Shotcut.app/Contents/MacOS/melt" \
            --melt master="$HOME/arms/master/Shotcut.app/Contents/MacOS/melt"
          cp ~/mlt-revisions.txt ~/melt-soak/
          {
            echo "### ${{ matrix.os }}: ${{ inputs.mlt_branch }} against its master base"
            cat ~/mlt-revisions.txt
            echo
            grep -E '^(fix|master): ' ~/melt-soak/summary.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: collect melt's crash reports
        if: always()
        run: |
          mkdir -p ~/melt-soak/crashes
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports \
            -iname 'melt*' -exec cp {} ~/melt-soak/crashes/ \; 2>/dev/null || true
          ls -la ~/melt-soak/crashes
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: melt-soak-${{ matrix.os }}
          path: ~/melt-soak
          if-no-files-found: warn
